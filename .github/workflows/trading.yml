name: GPT Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lancer le robot
        run: python bot.py

      - name: Sauvegarder le portefeuille
        run: |
          git config user.name "GPT Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "Mise a jour du portefeuille"
          git push
